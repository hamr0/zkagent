[libraries]
material = "com.google.android.material:material:1.13.0"
androidx-core-ktx = "androidx.core:core-ktx:1.18.0"
materialdatetimepicker = "com.wdullaer:materialdatetimepicker:4.2.3"
jmrtd = "org.jmrtd:jmrtd:0.7.18"
scuba-sc-android = "net.sf.scuba:scuba-sc-android:0.0.18"
spongycastle-prov = "com.madgag.spongycastle:prov:1.58.0.0"
# do not update
bcpkix-jdk15on = "org.bouncycastle:bcpkix-jdk15on:1.65"
commons-io = "commons-io:commons-io:2.22.0"
androidx-biometric = "androidx.biometric:biometric:1.1.0"
junit = "junit:junit:4.13.2"
# TEST-ONLY — android.jar's org.json classes are stubs under the plain JVM
# unit-test sandbox (`unitTests.isReturnDefaultValues`): JSONObject compiles
# but every accessor silently returns a default (null/0/false), which is
# not a behavior RequestTrust's/HandoffClient's JWS-parsing tests can run
# against. The real org.json (same package, Apache-2.0) shadows the stub on
# the unit-test classpath only — never shipped in the app APK.
json = "org.json:json:20240303"

[plugins]
android-application = { id = "com.android.application", version = "8.13.0" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.2.20" }
